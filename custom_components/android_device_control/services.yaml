set_ringer_mode:
  fields:
    device_id: &device_field
      required: true
      selector:
        device:
          integration: mobile_app
          multiple: true
    mode:
      required: true
      selector:
        select:
          translation_key: ringer_mode
          options: [normal, vibrate, silent]

set_volume:
  fields:
    device_id: *device_field
    stream:
      required: true
      selector:
        select:
          translation_key: volume_stream
          options: [alarm, call, dtmf, media, notification, ring, system, assistant]
    level:
      required: true
      selector:
        number:
          min: 0
          mode: box

set_do_not_disturb:
  fields:
    device_id: *device_field
    mode:
      required: true
      selector:
        select:
          translation_key: dnd_mode
          options: ["off", priority_only, alarms_only, total_silence]

media_control:
  fields:
    device_id: *device_field
    media_command:
      required: true
      selector:
        select:
          translation_key: media_command
          options: [play, pause, play_pause, stop, next, previous, fast_forward, rewind]
    app:
      selector:
        select:
          options:
            - {value: com.google.android.youtube, label: YouTube}
            - {value: com.google.android.apps.youtube.music, label: YouTube Music}
            - {value: com.spotify.music, label: Spotify}
            - {value: com.netflix.mediaclient, label: Netflix}
            - {value: com.plexapp.android, label: Plex}
            - {value: com.amazon.avod.thirdpartyclient, label: Amazon Prime Video}
            - {value: com.disney.disneyplus, label: Disney+}
            - {value: org.videolan.vlc, label: VLC}
            - {value: custom, label: Custom package}
    package_name:
      example: com.spotify.music
      selector:
        text:

stop_tts:
  fields:
    device_id: *device_field

turn_screen_on:
  fields:
    device_id: *device_field
    keep_screen_on:
      default: false
      selector:
        boolean:

set_screen_brightness:
  fields:
    device_id: *device_field
    brightness:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

set_auto_brightness:
  fields:
    device_id: *device_field
    enabled: &enabled_field
      required: true
      selector:
        boolean:

set_screen_timeout:
  fields:
    device_id: *device_field
    duration:
      required: true
      selector:
        duration:
          enable_day: false

open_webview:
  fields:
    device_id: *device_field
    path:
      example: /lovelace/settings
      selector:
        text:

set_flashlight:
  fields:
    device_id: *device_field
    enabled: *enabled_field

set_bluetooth:
  fields:
    device_id: *device_field
    enabled: *enabled_field

set_ble_transmitter:
  fields:
    device_id: *device_field
    enabled: *enabled_field

configure_ble_transmitter:
  fields:
    device_id: *device_field
    setting:
      required: true
      selector:
        select:
          translation_key: ble_setting
          options: [advertise_mode, transmit_power, uuid, major, minor, measured_power]
    value:
      required: true
      example: balanced
      selector:
        text:

set_beacon_monitor:
  fields:
    device_id: *device_field
    enabled: *enabled_field

request_location_update:
  fields:
    device_id: *device_field

update_sensors:
  fields:
    device_id: *device_field

set_high_accuracy_mode:
  fields:
    device_id: *device_field
    mode:
      required: true
      selector:
        select:
          translation_key: high_accuracy_mode
          options: [turn_on, turn_off, force_on, force_off]

set_high_accuracy_interval:
  fields:
    device_id: *device_field
    interval:
      required: true
      selector:
        number:
          min: 5
          unit_of_measurement: s
          mode: box

set_alarm:
  fields:
    device_id: *device_field
    alarm_time:
      required: true
      selector:
        time:
    label:
      selector:
        text:
    repeat:
      selector:
        select:
          multiple: true
          translation_key: alarm_weekday
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    vibrate:
      selector:
        boolean:
    ringtone:
      default: default
      selector:
        select:
          translation_key: alarm_ringtone
          options: [default, silent, custom]
    ringtone_uri:
      example: content://media/external/audio/media/123
      selector:
        text:
    skip_ui:
      default: false
      selector:
        boolean:
    clock_app: &clock_app_field
      default: default
      selector:
        select:
          translation_key: clock_app
          options: [default, google_clock, custom]
    clock_package: &clock_package_field
      example: com.example.clock
      selector:
        text:

dismiss_alarm:
  fields:
    device_id: *device_field
    alarm:
      required: true
      selector:
        select:
          translation_key: alarm_search
          options: [next, time, label]
    alarm_time:
      selector:
        time:
    alarm_label:
      selector:
        text:
    clock_app: *clock_app_field
    clock_package: *clock_package_field

snooze_alarm:
  fields:
    device_id: *device_field
    duration:
      selector:
        duration:
          enable_day: false
    clock_app: *clock_app_field
    clock_package: *clock_package_field

show_alarms:
  fields:
    device_id: *device_field
    clock_app: *clock_app_field
    clock_package: *clock_package_field

set_timer:
  fields:
    device_id: *device_field
    duration:
      required: true
      selector:
        duration:
          enable_day: false
    label:
      selector:
        text:
    skip_ui:
      default: false
      selector:
        boolean:
    clock_app: *clock_app_field
    clock_package: *clock_package_field

dismiss_expired_timers:
  fields:
    device_id: *device_field
    clock_app: *clock_app_field
    clock_package: *clock_package_field

show_timers:
  fields:
    device_id: *device_field
    clock_app: *clock_app_field
    clock_package: *clock_package_field

