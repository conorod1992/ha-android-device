name: Android end-to-end

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  companion:
    name: Companion Android 35
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install server and test tools
        run: pip install pytest==8.4.1 pytest-asyncio==1.1.0 requests==2.32.5 uiautomator2==3.5.0 websocket-client==1.9.0
      - name: Pull complete Home Assistant runtime
        run: docker pull ghcr.io/home-assistant/home-assistant:2026.7.2
      - name: Download pinned official Companion APK
        run: |
          curl --fail --location --retry 3 -o companion.apk https://github.com/home-assistant/android/releases/download/2026.10.1/app-minimal-release.apk
          echo '0e8b7adc7430d3ff414b711d5ad25881c94df442fbce5952b70e580c7f208783  companion.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Companion notification tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python -m pytest e2e/android -v --junitxml=e2e-artifacts/results.xml
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-35
          path: e2e-artifacts/
          retention-days: 7
